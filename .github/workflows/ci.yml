name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q software hardware/fusion_tools
      - name: Test gait profile validation
        env:
          PYTHONPATH: software/sharky_control
        run: python -m pytest -q software/sharky_control/test/test_gait_profile.py
      - name: Validate example gait profile
        env:
          PYTHONPATH: software/sharky_control
        run: python -m sharky_control.gait_profile config/smooth_crawl_v1.json
